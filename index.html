<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0e1f">
<title>Para Esteysi, mi amor</title>

<!--
  ============================================================
  CÓMO PERSONALIZAR ESTA TARJETA (todo está en este archivo)
  ============================================================
  1) Busca el bloque "CONFIG" dentro de la etiqueta <script> (casi
     al final del archivo). Ahí puedes cambiar:
       - recipientName  → el nombre de la persona
       - messages        → la lista de mensajes (título + texto)
  2) Los colores están como variables CSS al inicio del <style>,
     bajo ":root". Cambia los valores hexadecimales si quieres
     otra paleta (por ejemplo, más violeta o más dorada).
  3) Todo el arte (caja, bombones, estrellas, luna, corazones)
     está dibujado con CSS/SVG, no usa imágenes externas, así
     que el archivo funciona solo, sin internet (excepto las
     fuentes de Google, que son opcionales y tienen respaldo).
  ============================================================
-->

<style>
  @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Quicksand:wght@400;500;600;700&display=swap');

  :root{
    /* ---- paleta: noche cósmica ---- */
    --void:           #0b0e1f;
    --void-deep:      #05060f;
    --nebula-violet:  #5b3a8e;
    --nebula-magenta: #c2467f;
    --star-gold:      #ffd897;
    --star-white:     #ffffff;

    --glass-fill:     rgba(255,255,255,.09);
    --glass-fill-2:   rgba(255,255,255,.04);
    --glass-strong:   rgba(255,255,255,.16);
    --glass-border:   rgba(255,255,255,.26);

    --ink-light:      #f5f1fb;
    --ink-soft:       #c3b9dd;
    --accent-pink:    #ff8fb3;
    --accent-gold:    #ffe3ad;

    --font-script: 'Caveat', 'Brush Script MT', cursive;
    --font-sans:   'Quicksand', system-ui, -apple-system, 'Segoe UI', sans-serif;
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body{
    margin:0;
    min-height:100vh;
    background: radial-gradient(circle at 50% 18%, #181c36 0%, var(--void) 55%, var(--void-deep) 100%);
    font-family: var(--font-sans);
    color: var(--ink-light);
    overflow-x:hidden;
  }

  body{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding: 32px 16px;
    position:relative;
  }

  /* ---------------------------------------------- */
  /* Fondo: galaxia — nebulosas, remolino y estrellas */
  /* ---------------------------------------------- */
  .galaxy-bg{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:0;
  }

  .swirl{
    position:absolute;
    width: 56vmax; height:56vmax;
    top:-22vmax; right:-20vmax;
    border-radius:50%;
    background: conic-gradient(from 0deg,
      rgba(91,58,142,.55), rgba(194,70,127,.32), rgba(11,14,31,0) 55%, rgba(91,58,142,.5));
    filter: blur(46px);
    opacity:.55;
    mix-blend-mode: screen;
    animation: spinSlow 130s linear infinite;
  }
  @keyframes spinSlow{ to{ transform: rotate(360deg); } }

  .nebula{
    position:absolute;
    border-radius:50%;
    filter: blur(60px);
    opacity:.45;
    mix-blend-mode: screen;
  }
  .nebula.n1{
    width: 38vmax; height:38vmax; left:-14vmax; bottom:-16vmax;
    background: var(--nebula-violet);
    animation: driftA 28s ease-in-out infinite alternate;
  }
  .nebula.n2{
    width: 26vmax; height:26vmax; right:6vmax; top:14vmax;
    background: var(--nebula-magenta);
    opacity:.3;
    animation: driftB 24s ease-in-out infinite alternate;
  }
  @keyframes driftA{ 0%{ transform:translate(0,0) scale(1); } 100%{ transform:translate(4vmax,-3vmax) scale(1.12); } }
  @keyframes driftB{ 0%{ transform:translate(0,0) scale(1); } 100%{ transform:translate(-3vmax,3vmax) scale(1.08); } }

  .starfield{ position:absolute; inset:0; }
  .star{
    position:absolute;
    border-radius:50%;
    background: var(--star-white);
    animation: twinkle ease-in-out infinite;
  }
  @keyframes twinkle{
    0%, 100%{ opacity:.15; transform: scale(.8); }
    50%{ opacity:1; transform: scale(1.15); }
  }

  .shooting-star{
    position:absolute;
    width:2px; height:2px;
    background: var(--star-white);
    border-radius:50%;
    box-shadow: 0 0 6px 1px rgba(255,255,255,.95);
    opacity:0;
  }
  .shooting-star::before{
    content:"";
    position:absolute;
    top:50%; right:0;
    width:80px; height:1px;
    transform: translateY(-50%);
    background: linear-gradient(90deg, rgba(255,255,255,.95), rgba(255,255,255,0));
  }
  .shooting-star.run{ animation: shoot 1.15s ease-out forwards; }
  @keyframes shoot{
    0%{ opacity:0; transform: translate(0,0) rotate(-32deg); }
    10%{ opacity:1; }
    82%{ opacity:.9; }
    100%{ opacity:0; transform: translate(-46vmax, 30vmax) rotate(-32deg); }
  }

  /* ---------------------------------------------- */
  /* Escenario                                       */
  /* ---------------------------------------------- */
  .stage{
    position:relative;
    z-index:1;
    width:100%;
    max-width: 440px;
    text-align:center;
  }

  .brand{
    font-family: var(--font-script);
    font-weight:700;
    font-size: clamp(2.3rem, 9vw, 3.1rem);
    margin: 0 0 4px;
    line-height:1.05;
    background: linear-gradient(95deg, var(--accent-gold), var(--accent-pink) 60%, #d9a6ff);
    -webkit-background-clip:text;
    background-clip:text;
    color: transparent;
    filter: drop-shadow(0 2px 14px rgba(194,70,127,.35));
  }

  .subtitle{
    margin: 0 0 30px;
    color: var(--ink-soft);
    font-size: 1rem;
    letter-spacing:.3px;
  }

  /* ---------------------------------------------- */
  /* Caja de bombones (vidrio)                       */
  /* ---------------------------------------------- */
  .box-zone{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:18px;
  }

  .box{
    position:relative;
    width: clamp(190px, 58vw, 240px);
    aspect-ratio: 230 / 190;
    perspective: 900px;
    -webkit-user-select:none;
    user-select:none;
  }

  .box-base{
    position:absolute;
    left:0; right:0; bottom:0;
    height: 78%;
    background: linear-gradient(160deg, var(--glass-fill), var(--glass-fill-2));
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(10px) saturate(140%);
    -webkit-backdrop-filter: blur(10px) saturate(140%);
    border-radius: 14px;
    box-shadow:
      0 18px 34px -14px rgba(0,0,0,.55),
      inset 0 1px 0 rgba(255,255,255,.12);
    padding: clamp(8px,3vw,12px);
    pointer-events: none;
  }

  .chocolates{
    height:100%;
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: clamp(6px,2vw,9px);
  }

  .choco{
    position:relative;
    background: linear-gradient(150deg, #7a4a30, #43261a);
    border-radius: 42% 42% 38% 38% / 58% 58% 42% 42%;
    box-shadow:
      inset 0 2px 4px rgba(255,255,255,.22),
      inset 0 -4px 6px rgba(0,0,0,.4),
      0 0 10px -2px rgba(255,216,151,.25);
    opacity:0;
    transform: scale(.3) translateY(14px);
    transition: transform .45s cubic-bezier(.34,1.56,.64,1), opacity .35s ease;
    transition-delay: var(--d, 0ms);
  }
  .box.open .choco{ opacity:1; transform: scale(1) translateY(0); }

  .choco::after{
    content:"";
    position:absolute; inset: 22% 18%;
    border: 2px solid rgba(255,233,189,.5);
    border-radius: 50%;
    border-right-color: transparent;
    border-bottom-color: transparent;
    transform: rotate(35deg);
  }
  .choco.dots::before{
    content:"";
    position:absolute; inset:0;
    background-image:
      radial-gradient(circle 2.5px at 30% 30%, #ffc3d6 95%, transparent 100%),
      radial-gradient(circle 2.5px at 55% 22%, #ffc3d6 95%, transparent 100%),
      radial-gradient(circle 2.5px at 70% 45%, #ffc3d6 95%, transparent 100%);
  }

  .box-lid{
    position:absolute;
    left:0; right:0; top:0;
    height: 58%;
    background: linear-gradient(155deg, rgba(194,70,127,.38), rgba(91,58,142,.38));
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(10px) saturate(140%);
    -webkit-backdrop-filter: blur(10px) saturate(140%);
    border-radius: 14px 14px 6px 6px;
    transform-style: preserve-3d;
    transform-origin: top center;
    transition: transform .85s cubic-bezier(.62,.04,.3,.94), box-shadow .85s ease;
    box-shadow:
      0 10px 20px -10px rgba(0,0,0,.55),
      inset 0 1px 0 rgba(255,255,255,.18);
    overflow:hidden;
    z-index:2;
    pointer-events: none;
  }
  .box-lid::before{
    /* cinta diagonal brillante */
    content:"";
    position:absolute;
    width:50px; height:200%;
    top:-50%; left:40%;
    background: linear-gradient(180deg, var(--accent-gold), var(--accent-pink));
    box-shadow: 0 0 16px 2px rgba(255,180,200,.45);
    transform: rotate(35deg);
    opacity:.85;
  }
  .lid-label{
    position:absolute;
    inset: 28% 12%;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    border: 1px solid rgba(255,255,255,.45);
    border-radius:6px;
    color: var(--accent-gold);
    font-family: var(--font-script);
    font-size: clamp(1rem, 4.4vw, 1.2rem);
    line-height:1.1;
    padding: 4px 6px;
    background: rgba(0,0,0,.12);
  }

  .box.open .box-lid{
    transform: rotateX(-122deg) translateY(2px);
    box-shadow: 0 2px 10px rgba(0,0,0,.35);
  }

  .box-wrap-btn{
    position:absolute;
    inset:0;
    cursor:pointer;
    background:transparent;
    border:none;
    padding:0;
    z-index: 5;
    touch-action: manipulation;
    user-select:none;
    -webkit-user-select:none;
    transition: transform .15s ease;
  }
  .box-wrap-btn:active{ transform: scale(.97); }
  .box-wrap-btn:focus-visible{
    outline: 3px solid var(--accent-gold);
    outline-offset: 4px;
    border-radius: 14px;
  }

  .hint{
    margin:0;
    font-size:.92rem;
    color: var(--ink-soft);
    min-height: 1.3em;
    transition: opacity .3s ease;
  }
  .hint.fade{ opacity:.45; }

  /* ---------------------------------------------- */
  /* Tarjeta de mensaje (vidrio, modal)               */
  /* ---------------------------------------------- */
  .note-overlay{
    position:fixed;
    inset:0;
    z-index: 10;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 20px;
    background: rgba(5,6,15,.55);
    backdrop-filter: blur(5px);
    opacity:0;
    pointer-events:none;
    transition: opacity .4s ease;
  }
  .note-overlay.show{ opacity:1; pointer-events:auto; }

  .note-card{
    position:relative;
    width:100%;
    max-width: 360px;
    background: linear-gradient(165deg, var(--glass-strong), var(--glass-fill-2));
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(22px) saturate(160%);
    -webkit-backdrop-filter: blur(22px) saturate(160%);
    border-radius: 24px;
    padding: 32px 26px 28px;
    box-shadow:
      0 30px 70px -20px rgba(0,0,0,.6),
      inset 0 1px 0 rgba(255,255,255,.2);
    transform: scale(.82) translateY(24px);
    transition: transform .5s cubic-bezier(.34,1.56,.64,1);
    overflow:hidden;
  }
  .note-overlay.show .note-card{ transform: scale(1) translateY(0); }

  .note-deco-sparkle{
    position:absolute;
    top:-14px; left:-14px;
    width:84px; height:84px;
    filter: drop-shadow(0 0 6px rgba(255,216,151,.55));
  }
  .note-deco-moon{
    position:absolute;
    bottom:-8px; right:-10px;
    width:74px; height:74px;
    filter: drop-shadow(0 0 8px rgba(255,216,151,.45));
  }

  .note-title{
    font-family: var(--font-script);
    font-weight:700;
    font-size: 2rem;
    margin: 0 0 16px;
    position:relative;
    z-index:1;
    background: linear-gradient(95deg, var(--accent-gold), var(--accent-pink));
    -webkit-background-clip:text;
    background-clip:text;
    color: transparent;
  }

  .note-art{
    width: 104px;
    height: 104px;
    margin: 0 auto 18px;
    border-radius: 18px;
    background: linear-gradient(160deg, var(--glass-fill), var(--glass-fill-2));
    border: 1px solid var(--glass-border);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .note-art svg{ width:54px; height:54px; }

  .note-text{
    position:relative;
    z-index:1;
    margin: 0 0 24px;
    font-size: 1.06rem;
    line-height:1.6;
    color: var(--ink-light);
    font-weight:500;
  }

  .btn-cerrar{
    position:relative;
    z-index:1;
    font-family: var(--font-sans);
    font-size: 1rem;
    font-weight:600;
    letter-spacing:.3px;
    color: var(--accent-gold);
    background: linear-gradient(160deg, var(--glass-strong), var(--glass-fill));
    border: 1px solid var(--glass-border);
    border-radius: 999px;
    padding: 12px 36px;
    min-height:48px;
    cursor:pointer;
    touch-action: manipulation;
    user-select:none;
    box-shadow: 0 10px 22px -10px rgba(194,70,127,.5);
    transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
  }
  .btn-cerrar:hover{ box-shadow: 0 12px 26px -10px rgba(194,70,127,.65); }
  .btn-cerrar:active{ transform: scale(.96); }
  .btn-cerrar:focus-visible{ outline: 3px solid var(--accent-gold); outline-offset:3px; }

  @media (max-width: 360px){
    .note-overlay{ padding:14px; }
    .note-card{ padding: 26px 20px 24px; }
  }

  @media (prefers-reduced-motion: reduce){
    .swirl, .nebula, .star{ animation: none; }
    .box-lid, .choco, .note-card, .note-overlay, .btn-cerrar{ transition-duration: .01ms !important; }
  }
</style>
</head>
<body>

<div class="galaxy-bg" aria-hidden="true">
  <div class="swirl"></div>
  <div class="nebula n1"></div>
  <div class="nebula n2"></div>
  <div class="starfield" id="starfield"></div>
</div>

<main class="stage">
  <h1 class="brand" id="brandTitle">Para Esteysi, mi amor</h1>
  <p class="subtitle">Toca la caja y descubre un mensaje</p>

  <div class="box-zone">
    <div class="box" id="box">
      <div class="box-base">
        <div class="chocolates">
          <div class="choco" style="--d:0ms"></div>
          <div class="choco dots" style="--d:90ms"></div>
          <div class="choco" style="--d:180ms"></div>
          <div class="choco dots" style="--d:270ms"></div>
        </div>
      </div>
      <div class="box-lid">
        <div class="lid-label" id="lidLabel">Para Esteysi</div>
      </div>
      <button class="box-wrap-btn" id="boxBtn" aria-label="Abrir la caja de bombones"></button>
    </div>
    <p class="hint" id="hint">Toca la caja para abrirla</p>
  </div>
</main>

<div class="note-overlay" id="noteOverlay">
  <div class="note-card" id="noteCard" role="dialog" aria-modal="true" aria-labelledby="noteTitle">

    <svg class="note-deco-sparkle" viewBox="0 0 100 100" aria-hidden="true">
      <path d="M30 4 L36 24 L56 30 L36 36 L30 56 L24 36 L4 30 L24 24 Z" fill="#ffe3ad" opacity=".95"/>
      <path d="M70 40 L74 52 L86 56 L74 60 L70 72 L66 60 L54 56 L66 52 Z" fill="#ff8fb3" opacity=".85"/>
      <path d="M58 12 L61 20 L69 23 L61 26 L58 34 L55 26 L47 23 L55 20 Z" fill="#ffffff" opacity=".8"/>
    </svg>

    <svg class="note-deco-moon" viewBox="0 0 100 100" aria-hidden="true">
      <path d="M62 8 A38 38 0 1 0 62 92 A30 30 0 1 1 62 8 Z" fill="#ffe3ad"/>
      <path d="M16 18 L19 26 L27 29 L19 32 L16 40 L13 32 L5 29 L13 26 Z" fill="#ffffff" opacity=".75"/>
      <path d="M14 56 L16 62 L22 64 L16 66 L14 72 L12 66 L6 64 L12 62 Z" fill="#ff8fb3" opacity=".7"/>
    </svg>

    <h2 class="note-title" id="noteTitle"></h2>
    <div class="note-art" id="noteArt"></div>
    <p class="note-text" id="noteText"></p>
    <button class="btn-cerrar" id="btnCerrar">Cerrar</button>
  </div>
</div>

<script>
/* ===========================================================
   CONFIG — personaliza aquí el nombre y los mensajes
   =========================================================== */
const CONFIG = {
  recipientName: "Esteysi",
  messages: [
    {
      title: "Gracias por todo",
      text: "Esteysi, gracias por tu cariño incondicional y por hacer que cada uno de mis días sea más especial contigo cerca.",
      icon: "heart"
    },
    {
      title: "Te amo infinito",
      text: "No hay palabras suficientes para describir cuánto te quiero. Eres lo mejor que me ha pasado.",
      icon: "infinity"
    },
    {
      title: "Mi persona favorita",
      text: "Entre tanto ruido, tú eres mi lugar tranquilo. Contigo todo se siente más liviano y más bonito.",
      icon: "sun"
    },
    {
      title: "Cada día contigo",
      text: "Podría elegir mil veces el mismo día si ese día lo paso a tu lado. Gracias por tanto, Esteysi.",
      icon: "flower"
    },
    {
      title: "Eres mi calma",
      text: "Cuando todo se complica, pensar en ti me devuelve la calma. Gracias por ser mi puerto seguro.",
      icon: "heart"
    },
    {
      title: "Para siempre tú y yo",
      text: "No importa lo que venga, mientras estemos juntos todo va a estar bien. Te elijo hoy y siempre.",
      icon: "infinity"
    }
  ]
};

/* ===========================================================
   Iconos en SVG (dibujados a mano, sin imágenes externas)
   =========================================================== */
const ICONS = {
  heart: `<svg viewBox="0 0 64 56" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M32 52 C32 52 4 35 4 17 C4 6 13 0 21 0 C27 0 31 4 32 9 C33 4 37 0 43 0 C51 0 60 6 60 17 C60 35 32 52 32 52 Z"
      fill="#ff8fb3"/>
  </svg>`,
  infinity: `<svg viewBox="0 0 80 44" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M20 8 C9 8 4 16 4 22 C4 28 9 36 20 36 C31 36 34 22 40 22 C46 22 49 36 60 36 C71 36 76 28 76 22 C76 16 71 8 60 8 C49 8 46 22 40 22 C34 22 31 8 20 8 Z"
      stroke="#ffe3ad" stroke-width="6" stroke-linecap="round"/>
  </svg>`,
  sun: `<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
    <g stroke="#ffe3ad" stroke-width="4" stroke-linecap="round">
      <path d="M32 2 V12"/><path d="M32 52 V62"/>
      <path d="M2 32 H12"/><path d="M52 32 H62"/>
      <path d="M10 10 L17 17"/><path d="M47 47 L54 54"/>
      <path d="M54 10 L47 17"/><path d="M17 47 L10 54"/>
    </g>
    <path d="M32 42 C32 42 18 32 18 22 C18 15 23 11 28 11 C31 11 32 14 32 16 C32 14 33 11 36 11 C41 11 46 15 46 22 C46 32 32 42 32 42 Z" fill="#ff8fb3"/>
  </svg>`,
  flower: `<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
    <g fill="#d9a6ff">
      <circle cx="32" cy="18" r="11"/>
      <circle cx="14" cy="30" r="11"/>
      <circle cx="50" cy="30" r="11"/>
      <circle cx="20" cy="46" r="11"/>
      <circle cx="44" cy="46" r="11"/>
    </g>
    <circle cx="32" cy="32" r="9" fill="#ffe3ad"/>
  </svg>`
};

/* ===========================================================
   Estado y referencias
   =========================================================== */
const box        = document.getElementById('box');
const boxBtn      = document.getElementById('boxBtn');
const hint        = document.getElementById('hint');
const lidLabel    = document.getElementById('lidLabel');
const brandTitle  = document.getElementById('brandTitle');
const overlay     = document.getElementById('noteOverlay');
const noteTitle   = document.getElementById('noteTitle');
const noteText    = document.getElementById('noteText');
const noteArt     = document.getElementById('noteArt');
const btnCerrar   = document.getElementById('btnCerrar');

lidLabel.textContent = "Para " + CONFIG.recipientName;
brandTitle.textContent = "Para " + CONFIG.recipientName + ", mi amor";

let isOpen = false;
let busy = false;
let pool = [];
let lastIndexShown = -1;

function shuffledIndices(n){
  const arr = Array.from({length:n}, (_, i) => i);
  for(let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function nextMessage(){
  if(pool.length === 0){
    pool = shuffledIndices(CONFIG.messages.length);
    if(pool.length > 1 && pool[0] === lastIndexShown){
      [pool[0], pool[1]] = [pool[1], pool[0]];
    }
  }
  const idx = pool.shift();
  lastIndexShown = idx;
  return CONFIG.messages[idx];
}

function openBox(){
  if(busy || isOpen) return;
  busy = true;
  isOpen = true;
  box.classList.add('open');
  hint.classList.add('fade');
  hint.textContent = "Abriendo...";
  triggerShootingStar();
  setTimeout(() => {
    showNote();
    busy = false;
  }, 950);
}

function showNote(){
  const msg = nextMessage();
  noteTitle.textContent = msg.title;
  noteText.textContent = msg.text;
  noteArt.innerHTML = ICONS[msg.icon] || ICONS.heart;
  overlay.classList.add('show');
}

function closeNote(){
  overlay.classList.remove('show');
  setTimeout(() => {
    box.classList.remove('open');
    isOpen = false;
    hint.classList.remove('fade');
    hint.textContent = "Toca la caja para otro mensaje";
  }, 420);
}

boxBtn.addEventListener('click', openBox);
box.addEventListener('click', openBox); // respaldo: abre aunque el toque llegue a la caja y no al botón
btnCerrar.addEventListener('click', closeNote);
overlay.addEventListener('click', (e) => {
  if(e.target === overlay) closeNote();
});
document.addEventListener('keydown', (e) => {
  if(e.key === 'Escape' && overlay.classList.contains('show')) closeNote();
});

/* ===========================================================
   Fondo de galaxia: estrellas y estrellas fugaces
   =========================================================== */
const starfield = document.getElementById('starfield');
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function buildStars(){
  const count = window.innerWidth < 480 ? 55 : 90;
  let html = '';
  for(let i = 0; i < count; i++){
    const top = Math.random() * 100;
    const left = Math.random() * 100;
    const size = (Math.random() * 1.8 + 0.8).toFixed(2);
    const dur = (Math.random() * 3 + 2).toFixed(2);
    const delay = (Math.random() * 5).toFixed(2);
    const gold = Math.random() < 0.18;
    html += `<span class="star" style="top:${top}%; left:${left}%; width:${size}px; height:${size}px;
      background:${gold ? 'var(--star-gold)' : 'var(--star-white)'};
      animation-duration:${dur}s; animation-delay:${delay}s;"></span>`;
  }
  starfield.innerHTML = html;
}
buildStars();

function triggerShootingStar(){
  if(reduceMotion) return;
  const el = document.createElement('div');
  el.className = 'shooting-star';
  el.style.top = (5 + Math.random() * 35) + 'vh';
  el.style.left = (55 + Math.random() * 35) + 'vw';
  document.querySelector('.galaxy-bg').appendChild(el);
  requestAnimationFrame(() => el.classList.add('run'));
  setTimeout(() => el.remove(), 1300);
}

if(!reduceMotion){
  setInterval(() => {
    if(Math.random() < 0.6) triggerShootingStar();
  }, 5000);
}

window.addEventListener('resize', () => {
  clearTimeout(window.__starResize);
  window.__starResize = setTimeout(buildStars, 300);
});
</script>
</body>
</html>
